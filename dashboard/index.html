<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Office · agent-runner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Office</h1>
      <span id="status" class="down">connecting…</span>
      <nav>
        <a href="#now">Now</a>
        <a href="#history">History</a>
        <a href="#office">Office</a>
      </nav>
    </header>
    <div id="office">
      <div id="floor">
        <canvas id="scene" aria-label="The office floor"></canvas>
        <div id="tip" hidden></div>
      </div>
      <aside id="side">
        <main id="panel"></main>
        <!-- outside #panel, which is rebuilt every second, so the log keeps its scroll position -->
        <section id="log" hidden>
          <h3>Log <span id="log-run" class="dim"></span> <button id="log-follow" type="button">Pause scrolling</button></h3>
          <pre id="log-lines"></pre>
        </section>
      </aside>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
