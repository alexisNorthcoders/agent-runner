# Office dashboard: the static page from this repo's dashboard/ folder on /office/, and the
# runner's office feed (SSE, 127.0.0.1 only) proxied on /office/feed. Include it inside a
# `server { … }` block, e.g.:
#
#   sudo cp docs/nginx/office.conf /etc/nginx/snippets/agent-runner-office.conf
#   # in the server block:  include snippets/agent-runner-office.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# The dashboard is LAN only: it has no auth, so keep the allow/deny lines (adjust the subnet), or
# serve it from a server block that only listens on the LAN. Change the alias path and the port
# (AGENT_RUNNER_PORT, default 3790) to match your install.

location = /office {
    return 301 /office/;
}

# The feed. It is read-only; nothing else on the runner's port is proxied.
location = /office/feed {
    allow 127.0.0.1;
    allow 192.168.0.0/16;
    deny all;

    proxy_pass http://127.0.0.1:3790/office/feed;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    # SSE: send each event as it comes, and keep the connection open (the runner resends the
    # snapshot every 30s, well inside this timeout)
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    gzip off;
}

location /office/ {
    allow 127.0.0.1;
    allow 192.168.0.0/16;
    deny all;

    alias /home/alexis/Projects/agent-runner/dashboard/;
    index index.html;
    # the page has no build step, so make the browser revalidate after a git pull
    add_header Cache-Control "no-cache";
}
